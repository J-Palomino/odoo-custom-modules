[options]
addons_path = /opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_port = 5432
db_name = odoo
proxy_mode = True
list_db = False
http_port = 8069
gevent_port = 8072
; Workers (overridden by ODOO_WORKERS env var in fix-config.sh)
; Nginx routes /websocket and /longpolling to gevent on port 8072
workers = 4
