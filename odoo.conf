[options]
addons_path = /opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_port = 5432
db_name = odoo
proxy_mode = True
list_db = False
; Load Redis session store on every startup (server-wide, no DB install needed)
server_wide_modules = base,web,mint_redis_session
http_port = 8069
gevent_port = 8072
; Workers (overridden by ODOO_WORKERS env var in fix-config.sh)
; Nginx routes /websocket and /longpolling to gevent on port 8072
workers = 4
; Prevent long-running requests from blocking workers
limit_time_real = 300
limit_time_cpu = 120
; Memory limits per worker (1.5 GB hard limit)
limit_memory_hard = 1610612736
limit_memory_soft = 1073741824
