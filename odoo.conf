[options]
addons_path = /opt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_port = 5432
db_name = odoo
proxy_mode = True
list_db = False
http_port = 8069
; Railway only exposes a single port (PORT=8069). In multi-worker mode
; (workers > 0) Odoo spawns a separate gevent worker on port 8072 for
; websockets, which Railway cannot route to.  Setting workers = 0 runs
; Odoo in single-process threaded mode where both HTTP and websocket
; traffic are served on port 8069.
workers = 0
