tunnel: 4a3d78d6-ec7a-4fdd-9871-0ef470e785ee
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Websocket/longpolling traffic
  - hostname: odoo.wtfextracts.com
    path: /websocket
    service: http://localhost:8072
  - hostname: odoo.wtfextracts.com
    path: /longpolling
    service: http://localhost:8072
  # All other Odoo traffic (UI, API, JSON-RPC)
  - hostname: odoo.wtfextracts.com
    service: http://localhost:8069
  # Catch-all (required by cloudflared)
  - service: http_status:404
